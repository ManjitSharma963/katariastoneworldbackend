# Application Configuration
spring.application.name=kataria-stone-world-apis
server.port=8080
# Bind to all network interfaces (0.0.0.0) to allow access from public IP addresses
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/katariadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=appuser
spring.datasource.password=app123

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Do NOT set globally_quoted_identifiers=true with MySQL: Hibernate quotes type names too (`INT`, `VARCHAR`),
# producing invalid DDL like MODIFY COLUMN x `INT`. Use explicit @Column names (payment_date, etc.) instead.
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging
# Logging
logging.level.org.springframework.web=INFO
logging.level.com.katariastoneworld.apis=DEBUG


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=manjitsharma963@gmail.com
spring.mail.password=mqryfhahdlxabklj
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-32-characters-long-for-security
#jwt.expiration=600000
jwt.expiration=72000000

# Spring MVC Configuration - Suppress warnings for NoResourceFoundException
# This prevents warnings when API paths are requested but don't exist as static resources
logging.level.org.springframework.web.servlet.resource=WARN

# CORS Configuration
# Set to true to allow all origins (useful for development)
# Set to false to use specific allowed origins list
cors.allow-all-origins=true
# Comma-separated list of allowed origins (used when cors.allow-all-origins=false)
# Example: cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://example.com
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost,http://68.183.93.217,https://www.katariastoneworld.com

# Disable Spring Boot's default CORS handling to avoid conflicts
spring.web.cors.allowed-origins=

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1

# Observability / reliability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true

spring.profiles.active=local

# Accounting engine (Phase 1: expense post/void via append-only cancel, no hard delete)
accounting.engine.expense.enabled=true
# Phase 2: bill payment post/void via accounting engine
accounting.engine.bill.enabled=true
# Phase 3: all refund OUT flows (stock return, advance refund, wallet mirrors, adjustment refunds)
accounting.engine.refund.enabled=true
# Phase 4+: remaining unified ledger flows
accounting.engine.advance.enabled=true
accounting.engine.loan.enabled=true
accounting.engine.receivable.enabled=true
accounting.engine.payroll.enabled=true
accounting.engine.client.enabled=true
accounting.engine.budget.enabled=true
accounting.engine.adjustment.enabled=true


spring.profile.active=local

# Audit report (application snapshot PDF)
audit.report.application-name=Kataria Stone World Inventory
audit.report.company-name=Kataria Stone World
audit.report.report-version=1.0
audit.report.application-version=1.0.0
audit.report.fetch-size=500
audit.report.max-cell-chars=120

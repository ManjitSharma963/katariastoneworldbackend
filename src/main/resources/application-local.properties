# Local development overrides.
# Copy deploy/local.env.example → .env.local and load vars, or set in your IDE run config.

spring.application.name=kataria-stone-world-apis-local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/new_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=rootpassword123

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

cors.allow-all-origins=true
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost,https://www.katariastoneworld.com,https://katariastoneworld.com

management.endpoint.health.show-details=always

springdoc.swagger-ui.enabled=true

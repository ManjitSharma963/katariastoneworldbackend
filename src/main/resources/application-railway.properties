# Use this profile to run locally against Railway MySQL (public proxy).
# Load secrets first:  Get-Content deploy\railway.env | ForEach-Object { ... }  OR set in IDE.
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=railway

spring.application.name=kataria-stone-world-apis-railway

# Public proxy — required when API runs outside Railway network
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://hayabusa.proxy.rlwy.net:47702/railway?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

cors.allow-all-origins=true
logging.level.com.katariastoneworld.apis=DEBUG
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

